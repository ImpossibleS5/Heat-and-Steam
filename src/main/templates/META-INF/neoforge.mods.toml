# Mod metadata template. Placeholders in the form dollar-brace are expanded from
# gradle.properties by the generateModMetadata task (see build.gradle).
# Edit gradle.properties for versions/ids.

modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
#authors=""
description='''
Recreation of the Russian banya ritual: a living room microclimate (temperature, humidity, smoke)
created by a stone stove and shaped by the player, with a Warmth stat, venik steaming and hardening.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
