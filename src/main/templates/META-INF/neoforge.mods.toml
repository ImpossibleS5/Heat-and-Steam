# Mod metadata template. Placeholders in the form dollar-brace are expanded from
# gradle.properties by the generateModMetadata task (see build.gradle).
# Edit gradle.properties for versions/ids.

modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="ImpossibleS5"
description='''
A Russian sauna, simulated. Each sealed room keeps its own microclimate: temperature, humidity and
smoke, raised by a stone stove and shaped by the player through the damper, the door and the ladle
of water thrown on the stones. Bathers gain Warmth for the heat they take, risk overheating without
a felt hat, are whisked with birch and oak, and harden themselves by plunging into the cold.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Hardening feeds Cold Sweat's freezing point and cold resistance when it is installed.
# No version range on purpose: the hook only looks attributes up by id, so it cannot break on a
# version we have not seen, and pinning a range would reject the 2.4 betas people still run.
# Verified against Cold Sweat 2.4.2.
[[dependencies.${mod_id}]]
    modId="cold_sweat"
    type="optional"
    ordering="AFTER"
    side="BOTH"
